[package]
name = "slave"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ortak kütüphanemiz
core = { path = "../../crates/core" }

# Asenkron Runtime ve io_uring
tokio = { version = "1.0", features = ["rt", "net", "macros"] } # current_thread için rt yeterlidir
tokio-uring = "0.5" # Tokio'nun resmi io_uring sürücüsü (veya ham kullanım için io-uring crate'i)

# CPU ve İşletim Sistemi Seviyesinde Kontroller
core_affinity = "0.8" # Worker'ı belirli bir CPU çekirdeğine pinlemek (sabitlemek) için
socket2 = { version = "0.5", features = ["all"] } # SO_REUSEPORT bayrağını manuel set etmek için
nix = { version = "0.29", features = ["socket", "feature"] } # Düşük seviyeli Linux çağrıları

# Performans ve Loglama
log = "0.4"
env_logger = "0.11"
