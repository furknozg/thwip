[package]
name = "slave"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
# Ortak kütüphanemiz
proxy_common = { package = "proxy-common", path = "../../crates/core" }

# Asenkron Runtime ve io_uring
tokio = { version = "1.0", features = ["rt", "net", "macros"] } # current_thread için rt yeterlidir

# CPU ve İşletim Sistemi Seviyesinde Kontroller
core_affinity = "0.8" # Worker'ı belirli bir CPU çekirdeğine pinlemek (sabitlemek) için
socket2 = { version = "0.5", features = ["all"] } # SO_REUSEPORT bayrağını manuel set etmek için
nix = { version = "0.29", features = ["socket", "feature"] } # Düşük seviyeli Linux çağrıları

# Performans ve Loglama
log = "0.4"
env_logger = "0.11"
mime_guess = "2"
signal-hook = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"


[target.'cfg(unix)'.dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
slab = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"
