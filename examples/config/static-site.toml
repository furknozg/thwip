# Static website with index.html resolution, ranges, ETags, and MIME detection.
worker_count = 2

[runtime]
type = "auto"

[worker]
max_connections = 2048
max_read_buffer_size = 65536
max_write_buffer_size = 8388608
idle_timeout_ms = 30000
drain_timeout_ms = 10000

[[http.servers]]
server_name = "static.local"
listen = "127.0.0.1:8080"

[[http.servers.locations]]
matcher = { type = "exact", path = "/health" }
action = { type = "response", status = 200, body = "static server ready" }

[[http.servers.locations]]
matcher = { type = "prefix", path = "/" }
action = { type = "static", directory = "./public" }
